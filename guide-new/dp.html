<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대중점평 연결 · 상하이 가족여행 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1d1b;
    --ink-2: #5c5b55;
    --yellow: #f4d738;
    --orange: #ff6600; /* Dianping signature orange */
    --orange-soft: #fff2eb;
    --blue: #1c95d3;
    --tint: #f5f4ed;
    --f-display: "Do Hyeon", "Black Han Sans", sans-serif;
    --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 16px;
    background: var(--tint);
    color: var(--ink);
    font-family: var(--f-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    width: 100%;
    max-width: 440px;
    padding: 24px 20px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--orange-soft);
    color: var(--orange);
    border: 2px solid var(--orange);
    border-radius: 999px;
    font-family: var(--f-display);
    font-size: 14px;
    padding: 3px 14px;
    margin-bottom: 12px;
  }
  h1 {
    font-family: var(--f-display);
    font-size: 26px;
    margin: 0 0 6px;
    line-height: 1.25;
  }
  .cn {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  .progress-wrap {
    background: #e9e8e0;
    border: 2px solid var(--ink);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    margin: 18px 0 6px;
    position: relative;
  }
  .progress-bar {
    background: var(--orange);
    height: 100%;
    width: 0%;
    transition: width 1.8s linear;
  }
  .timer-hint {
    font-size: 12.5px;
    color: var(--ink-2);
    margin-bottom: 20px;
    font-weight: 600;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 16px;
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    font-family: var(--f-display);
    font-size: 16.5px;
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 2.5px 2.5px 0 var(--ink);
    cursor: pointer;
    background: #fff;
    transition: transform .06s, box-shadow .06s;
  }
  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }
  .btn-dp {
    background: var(--orange);
    color: #fff;
  }
  .btn-fallback {
    background: var(--blue);
    color: #fff;
  }
  .btn-copy {
    background: var(--yellow);
    color: var(--ink);
  }
  .btn-back {
    background: #fff;
    color: var(--ink-2);
    border-color: #aaa;
    box-shadow: 1.5px 1.5px 0 #bbb;
    font-size: 14px;
    padding: 9px;
    margin-top: 6px;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(29,29,27,.92);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">🍽️ 대중점평(大众点评) 스마트 연결</div>
  <h1 id="placeTitle">식당 · 명소 찾는 중...</h1>
  <div class="cn" id="placeCn"></div>

  <div class="progress-wrap"><div class="progress-bar" id="pBar"></div></div>
  <div class="timer-hint" id="timerHint">대중점평 앱 연결 시도 중... (1.5초 후 모바일 웹 자동 연결)</div>

  <div class="btn-group">
    <a href="#" id="btnDpApp" class="btn btn-dp">📱 대중점평 앱 바로 열기</a>
    <a href="#" id="btnWeb" class="btn btn-fallback">🌐 대중점평 모바일 웹으로 열기</a>
    <button type="button" id="btnCopy" class="btn btn-copy">📋 매장 이름 복사하기</button>
    <a href="javascript:history.back()" class="btn btn-back">← 가이드북으로 돌아가기</a>
  </div>
</div>

<div id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const keyword = params.get('keyword') || params.get('q') || params.get('name') || '上海美食';

document.getElementById('placeTitle').textContent = keyword;
document.getElementById('placeCn').textContent = keyword;
document.title = keyword + ' · 대중점평 스마트 연결';

const enc = encodeURIComponent;

// 1. 대중점평 딥링크 스킴
// dianping://searchshoplist?keyword=...
const dpAppUrl = 'dianping://searchshoplist?keyword=' + enc(keyword);

// 2. 모바일 웹 폴백 URL
const dpWebUrl = 'https://m.dianping.com/search/keyword/1/0_' + enc(keyword);

const btnDpApp = document.getElementById('btnDpApp');
const btnWeb = document.getElementById('btnWeb');
btnDpApp.href = dpAppUrl;
btnWeb.href = dpWebUrl;

document.getElementById('btnCopy').onclick = () => {
  navigator.clipboard.writeText(keyword).then(() => {
    showToast('매장 이름을 복사했습니다! 앱에서 검색하세요.');
  }).catch(() => {
    showToast('복사 완료');
  });
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// 자동 리다이렉트 프로세스
let pageLeft = false;
window.addEventListener('pagehide', () => { pageLeft = true; });
window.addEventListener('blur', () => { pageLeft = true; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pageLeft = true;
});

// 시작: 프로그레스바 가동
requestAnimationFrame(() => {
  document.getElementById('pBar').style.width = '100%';
});

// 먼저 대중점평 앱 딥링크 호출 시도
try {
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = dpAppUrl;
  document.body.appendChild(iframe);
} catch(e){}

// 1.8초 후 앱으로 안 빠져나갔으면 모바일 웹으로 자동 이동
const redirectTimer = setTimeout(() => {
  if (!pageLeft) {
    document.getElementById('timerHint').textContent = '모바일 웹으로 자동 연결합니다...';
    window.location.replace(dpWebUrl);
  }
}, 1800);
</script>

</body>
</html>
