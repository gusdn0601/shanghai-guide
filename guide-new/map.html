<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도 길찾기 · 상하이 가족여행 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1d1b;
    --ink-2: #5c5b55;
    --yellow: #f4d738;
    --blue: #1c95d3;
    --green: #2a9a68;
    --page: #fbfbf9;
    --tint: #f5f4ed;
    --f-display: "Do Hyeon", "Black Han Sans", sans-serif;
    --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 16px;
    background: var(--tint);
    color: var(--ink);
    font-family: var(--f-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    width: 100%;
    max-width: 440px;
    padding: 24px 20px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-family: var(--f-display);
    font-size: 14px;
    padding: 3px 14px;
    margin-bottom: 12px;
  }
  h1 {
    font-family: var(--f-display);
    font-size: 26px;
    margin: 0 0 6px;
    line-height: 1.25;
  }
  .cn {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  .addr {
    font-size: 13.5px;
    color: #666;
    background: var(--tint);
    border: 1.5px dashed #ccc;
    border-radius: 10px;
    padding: 8px 12px;
    margin: 12px 0 18px;
    line-height: 1.4;
    word-break: break-all;
  }
  .progress-wrap {
    background: #e9e8e0;
    border: 2px solid var(--ink);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
    margin: 14px 0 6px;
    position: relative;
  }
  .progress-bar {
    background: var(--blue);
    height: 100%;
    width: 0%;
    transition: width 1.8s linear;
  }
  .timer-hint {
    font-size: 12.5px;
    color: var(--ink-2);
    margin-bottom: 20px;
    font-weight: 600;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 16px;
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    font-family: var(--f-display);
    font-size: 16.5px;
    font-weight: 700;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 2.5px 2.5px 0 var(--ink);
    cursor: pointer;
    background: #fff;
    transition: transform .06s, box-shadow .06s;
  }
  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }
  .btn-amap {
    background: #2a9a68;
    color: #fff;
  }
  .btn-fallback {
    background: var(--blue);
    color: #fff;
  }
  .btn-copy {
    background: var(--yellow);
    color: var(--ink);
  }
  .btn-back {
    background: #fff;
    color: var(--ink-2);
    border-color: #aaa;
    box-shadow: 1.5px 1.5px 0 #bbb;
    font-size: 14px;
    padding: 9px;
    margin-top: 6px;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(29,29,27,.92);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">📍 길찾기 스마트 리다이렉트</div>
  <h1 id="placeKr">목적지 찾는 중...</h1>
  <div class="cn" id="placeCn"></div>
  <div class="addr" id="placeAddr"></div>

  <div class="progress-wrap"><div class="progress-bar" id="pBar"></div></div>
  <div class="timer-hint" id="timerHint">고덕지도 연결 시도 중... (1.5초 후 기본 지도 자동 실행)</div>

  <div class="btn-group">
    <a href="#" id="btnAmap" class="btn btn-amap">🇨🇳 고덕지도(Amap) 바로 열기</a>
    <a href="#" id="btnFallback" class="btn btn-fallback">🗺️ 기본 지도(구글/애플)로 열기</a>
    <button type="button" id="btnCopy" class="btn btn-copy">📋 중국어 주소 복사하기</button>
    <a href="javascript:history.back()" class="btn btn-back">← 가이드북으로 돌아가기</a>
  </div>
</div>

<div id="toast"></div>

<script>
const PLACES = {"hotel":{"kr":"골든 튤립 더 번드 상하이","cn":"金郁金香外滩新亚酒店","addr":"上海市黄浦区天潼路422号","city":"上海"},"siji":{"kr":"사계민복 오리구이","cn":"四季民福烤鸭店(外滩外白渡桥店)","addr":"上海市虹口区吴淞路130号北楼3楼","city":"上海"},"yuyuanEve":{"kr":"성황묘 · 구곡교 · 호심정","cn":"上海城隍庙 九曲桥 湖心亭","addr":"上海市黄浦区方浜中路249号","city":"上海"},"bund":{"kr":"와이탄","cn":"外滩","addr":"上海市黄浦区中山东一路","city":"上海"},"nanxiang":{"kr":"남상만두점","cn":"南翔馒头店(豫园店)","addr":"上海市黄浦区豫园路85号","city":"上海"},"yugarden":{"kr":"예원 정원","cn":"豫园","addr":"上海市黄浦区安仁街218号","city":"上海"},"newworld":{"kr":"신세계성 · 릴리안 에그타르트","cn":"新世界城 莉莲蛋挞","addr":"上海市黄浦区南京西路2-68号 新世界城B1","city":"上海"},"xizha":{"kr":"우전 서책(시자)","cn":"乌镇西栅景区","addr":"浙江省嘉兴市桐乡市乌镇镇石佛南路18号","city":"嘉兴"},"jingan":{"kr":"정안사","cn":"静安寺","addr":"上海市静安区南京西路1686号","city":"上海"},"roastery":{"kr":"스타벅스 리저브 로스터리","cn":"星巴克臻选上海烘焙工坊","addr":"上海市静安区南京西路789号 兴业太古汇","city":"上海"},"louis":{"kr":"루이호","cn":"路易号 兴业太古汇","addr":"上海市静安区南京西路789号 兴业太古汇","city":"上海"},"skewer":{"kr":"헌지우이치엔 양꼬치","cn":"很久以前羊肉串(南京西路818广场店)","addr":"上海市静安区南京西路818号 818广场B1","city":"上海"},"nanjing":{"kr":"난징둥루 보행가","cn":"南京东路步行街","addr":"上海市黄浦区南京东路","city":"上海"},"lujiazui":{"kr":"루자쭈이","cn":"陆家嘴","addr":"上海市浦东新区陆家嘴环路","city":"上海"},"shtower":{"kr":"상하이타워","cn":"上海中心大厦","addr":"上海市浦东新区银城中路501号","city":"上海"},"hotpot":{"kr":"좌정우원 소고기 훠궈","cn":"左庭右院鲜牛肉火锅 正大广场","addr":"上海市浦东新区陆家嘴西路168号 正大广场","city":"上海"},"binjiang":{"kr":"빈장다다오 강변 야경","cn":"滨江大道","addr":"上海市浦东新区滨江大道","city":"上海"},"madi":{"kr":"대한민국 임시정부 청사","cn":"大韩民国临时政府旧址","addr":"上海市黄浦区马当路306弄4号","city":"上海"},"xintiandi":{"kr":"신천지","cn":"新天地","addr":"上海市黄浦区太仓路181弄(북리) / 兴业路123弄(남리)","city":"上海"},"dintaifung":{"kr":"딘타이펑","cn":"鼎泰丰(新天地时尚Ⅰ店)","addr":"上海市黄浦区兴业路123弄1-7号 新天地南里 F2","city":"上海"},"tianzifang":{"kr":"티엔즈팡","cn":"田子坊","addr":"上海市黄浦区泰康路210弄 (248弄·274弄 포함)","city":"上海"},"wukang":{"kr":"우캉루 · 우캉빌딩","cn":"武康路 武康大楼(诺曼底公寓)","addr":"上海市徐汇区武康路 / 淮海中路1850号(우캉빌딩)","city":"上海"},"shnhm":{"kr":"상하이 자연사박물관","cn":"上海自然博物馆","addr":"上海市静安区北京西路510号","city":"上海"},"laojishi":{"kr":"라오지스 주가","cn":"老吉士酒家(天平路店)","addr":"上海市徐汇区天平路41号","city":"上海"},"beiwaitan":{"kr":"북외탄 · 쑤저우허 야경","cn":"北外滩滨江 / 苏州河北岸","addr":"上海市虹口区东大名路 일대(白玉兰广场 방면)","city":"上海"},"airporthotel":{"kr":"이롱 안위에 호텔","cn":"艺龙安悦酒店(上海浦东国际机场店)","addr":"上海市浦东新区施新路802弄1号","city":"上海"},"pvgT1":{"kr":"푸동공항 T1 출국","cn":"上海浦东国际机场 1号航站楼","addr":"上海市浦东新区启航路900号","city":"上海"},"maglev":{"kr":"자기부상열차","cn":"上海磁浮列车","addr":"龙阳路站 ↔ 浦东机场站","city":"上海"}};

const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
const params = new URLSearchParams(location.search);
const pKey = params.get('p');
const customName = params.get('name') || params.get('keyword');
const customAddr = params.get('addr');
const customCity = params.get('city') || '上海';

let place = null;
if (pKey && PLACES[pKey]) {
  place = PLACES[pKey];
} else if (customName) {
  // Search in PLACES by cn or kr
  const foundKey = Object.keys(PLACES).find(k => PLACES[k].cn === customName || PLACES[k].kr === customName);
  if (foundKey) place = PLACES[foundKey];
}

if (!place) {
  place = {
    kr: customName || '상하이 목적지',
    cn: customName || '上海',
    addr: customAddr || '',
    city: customCity
  };
}

document.getElementById('placeKr').textContent = place.kr;
document.getElementById('placeCn').textContent = place.cn;
document.getElementById('placeAddr').textContent = place.addr || '(주소 정보 없음)';
document.title = place.kr + ' 길찾기 · 상하이 가이드';

const enc = encodeURIComponent;
const searchTarget = (place.cn + ' ' + (place.addr || '')).trim();

// 1. 고덕지도 URL (앱 호출 스킴 및 웹 리다이렉트)
const amapWeb = 'https://uri.amap.com/search?keyword=' + enc(place.cn) + '&city=' + enc(place.city||'上海') + '&src=familyguide&callnative=1';
const amapApp = isIos
  ? 'iosamap://poi?sourceApplication=familyguide&name=' + enc(place.cn) + '&address=' + enc(place.addr||'')
  : 'androidamap://poi?sourceApplication=familyguide&keywords=' + enc(place.cn);

// 2. 기본 지도 URL (iOS: 애플 지도, Android/PC: 구글 지도)
const fallbackMap = isIos
  ? 'https://maps.apple.com/?q=' + enc(searchTarget)
  : 'https://www.google.com/maps/search/?api=1&query=' + enc(searchTarget);

const btnAmap = document.getElementById('btnAmap');
const btnFallback = document.getElementById('btnFallback');
btnAmap.href = amapWeb;
btnFallback.href = fallbackMap;
btnFallback.textContent = isIos ? '🍎 애플 기본 지도로 열기' : '🌐 구글 지도로 열기';

document.getElementById('btnCopy').onclick = () => {
  const text = place.cn + (place.addr ? ' ' + place.addr : '');
  navigator.clipboard.writeText(text).then(() => {
    showToast('주소를 복사했습니다! 지도 앱에 붙여넣으세요.');
  }).catch(() => {
    showToast('복사 실패: 수동으로 복사해주세요.');
  });
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// 자동 리다이렉트 프로세스
let pageLeft = false;
window.addEventListener('pagehide', () => { pageLeft = true; });
window.addEventListener('blur', () => { pageLeft = true; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pageLeft = true;
});

// 시작: 프로그레스바 가동
requestAnimationFrame(() => {
  document.getElementById('pBar').style.width = '100%';
});

// 먼저 고덕지도 앱 딥링크 호출 시도
try {
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = amapApp;
  document.body.appendChild(iframe);
} catch(e){}

// 1.8초 후 고덕지도로 안 빠져나갔으면 "안되면 맵으로!"
const redirectTimer = setTimeout(() => {
  if (!pageLeft) {
    document.getElementById('timerHint').textContent = '기본 지도로 자동 연결합니다...';
    window.location.replace(fallbackMap);
  }
}, 1800);
</script>

</body>
</html>
